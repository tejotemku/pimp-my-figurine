<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pimp my figurine</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add,add_photo_alternate,check,close,edit,ink_eraser,palette,text_ad,text_ad_off" />
    <style>
     
    </style>
  </head>
  <body>
      <div id="board">
          <canvas id="mini-canvas" style="z-index: 3;"></canvas>
          <canvas id="mini-painter-board-background"></canvas>
          <canvas id="mini-painter-board-background-greyscale" style="z-index: 2"></canvas>
          <div id="brush"></div>
          <span id="hide-ui-button" class="material-symbols-outlined hide-ui">text_ad_off</span>
      </div>
      <div id="sidebar" class="ui-controls">
        <!-- upload image -->
        <input type="file" id="mini-image-upload" name="Image import." accept="image/*" />
        <label for="mini-image-upload" class="button">
          <span class="material-symbols-outlined">add_photo_alternate</span>
           Upload image
         </label>
         
        <hr />

        <!-- greyscale -->
        <input type="checkbox" id="greyscale" value="greyscale" />   
        <label for="greyscale" class="toggle-switch">
            <span class="toggle-switch-controler"></span>
            <span class="label-text">Greyscale</span>
        </label>

        <!-- overrite pixels -->
        <input type="checkbox" id="overwrite-pixels" value="overwrite-pixels" /> 
        <label for="overwrite-pixels" class="toggle-switch">
            <span class="toggle-switch-controler"></span>
            <span class="label-text">Overwrite pixels</span>
        </label>

        <!-- brush size -->
        <span class="slider-wrapper">
          <input type="range" min="1" max="20" value="5" id="brush-size-slider">
          <label for="brush-size-slider" id="brush-size-slider-label">
            Brush size: 5
          </label>
        </span>

        <!-- opacity -->
        <span class="slider-wrapper">
          <input type="range" min="1" max="100" value="50" id="color-opacity-slider">
          <label for="color-opacity-slider" id="color-opacity-slider-label">
            Color opacity : 50%
          </label>
        </span>
        
        <!-- colors & eraser -->
        <span class="color-controls">
          <label id="layer-color-eraser" class="button">
            <span class="material-symbols-outlined">ink_eraser</span>
            Eraser
          </label>
  
          <label id="add-new-layer" class="button">
            New paint
            <span class="material-symbols-outlined">add</span>
          </label>
        </span>
        <div id="color-layers">
          <!-- here layers go -->
        </div>

        <hr />
        <!-- links -->
        <a href="https://www.dakkadakka.com/wiki/en/Paint_Range_Compatibility_Chart" target="_about">  
          <span class="material-symbols-outlined">palette</span> 
          DakkaDakka paints chart
        </a>
      </div>
    <script src="./index.js"></script>
  </body>
</html>
